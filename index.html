<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="SemTrack - login page for a Semester 4 study planner">
  <meta name="author" content="Fatin Nazira Wirda">
  <title>Login | SemTrack</title>
  <!-- Bootstrap 5 (CSS framework) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body class="login-body">

  <main class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
      <div class="col-11 col-sm-8 col-md-6 col-lg-4">
        <div class="card shadow-lg border-0 login-card">
          <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
              <i class="bi bi-calendar-check-fill brand-icon"></i>
              <h1 class="h3 fw-bold mt-2">SemTrack</h1>
              <p class="text-muted mb-0">Sign in to view my Semester 4 plan</p>
            </div>

            <!-- Error message (hidden until login fails) -->
            <div id="loginError" class="alert alert-danger d-none" role="alert">
              <i class="bi bi-exclamation-triangle-fill me-1"></i>
              Invalid username or password. Please try again.
            </div>

            <form id="loginForm" novalidate>
              <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <!-- value="..." pre-fills the lecturer's login so nothing needs to be typed -->
                <input type="text" class="form-control" id="username" placeholder="Enter username" value="nazira" required>
              </div>
              <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Enter password" value="852369" required>
              </div>
              <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>

            <div class="login-hint mt-4">
              <div class="fw-semibold small mb-2 text-center">
                <i class="bi bi-info-circle-fill me-1"></i>How to log in
              </div>
              <table class="table table-sm table-borderless mb-0 small mx-auto w-auto">
                <tr><td class="text-muted">Username</td><td><code>nazira</code></td></tr>
                <tr><td class="text-muted">Password</td><td><code>852369</code></td></tr>
              </table>
              <div class="hint-note">
                <i class="bi bi-check-circle-fill me-1"></i>Already filled in for you. Just click <strong>Login</strong>.
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="auth.js"></script>
  <script>
    // Attach the login handler to the form
    document.getElementById("loginForm").addEventListener("submit", handleLogin);
  </script>
</body>
</html>
